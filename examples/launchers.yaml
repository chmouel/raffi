# yaml-language-server: $schema=launchers-schema.json
# Validate this file with: raffi --check-config
#
# Launcher entries, keyed by name. Put this file next to raffi.yaml
# (~/.config/raffi/launchers.yaml). It is used when raffi.yaml has no
# `launchers:` section of its own.
#
# With addons.apps.enabled: true in raffi.yaml, installed .desktop applications
# are listed automatically, so plain GUI apps usually need no entry here.
# Raffi's native UI also includes built-in addons for clipboard history (`clip `),
# passwords and Bitwarden (`pass `, `bw `), calculator expressions, emoji (`emoji `),
# audio (`audio `), system power actions (`sys `), and file browsing (`~/`).
# See https://chmouel.github.io/raffi/ for addon docs; if you use `ui_type: fuzzel`,
# you can still add external tools as launchers here.
#
# Use `ifexist`, `ifenvset`, `ifenveq`, or `ifcompositor` to keep a shared
# multi-machine config clean without showing entries whose tools are absent.

# Enter focuses Thunderbird when it is already open, Ctrl+Enter starts a new
# one (Hyprland, niri, sway). window_class defaults to the binary name, which
# is enough for a plain binary without args.
thunderbird:
  binary: thunderbird
  description: "Thunderbird"
  icon: thunderbird
  ifexist: thunderbird
  raise: true

# Arguments or a script give `raise` no class to infer, so set `window_class`
# explicitly. `desktop` links this launcher to the installed .desktop file so
# `addons.apps` does not list Chromium a second time while keeping its actions.
chromium-work:
  binary: chromium
  args: ["--profile-directory=Work"]
  description: "Chromium (Work)"
  icon: chromium
  ifexist: chromium
  raise: true
  window_class: Chromium
  desktop: chromium.desktop

# jumpapp is a helper for compositors/WMs without built-in raise support:
# https://gitlab.com/chmouel/chmouzies/-/blob/main/graphical/sway-jumpapp
wally:
  args: ["-X", "wally"]
  binary: jumpapp
  description: "Wally"
  icon: wally
  ifexist: wally
  window_class: wally

evolution-mail:
  args: ["-t", "Evolution", "-X", "evolution"]
  binary: jumpapp
  description: "Evolution Mail"
  icon: evolution-mail
  ifexist: evolution
  window_class: evolution

signal:
  args: ["-X", "signal", "signal-desktop"]
  binary: jumpapp
  description: "Signal"
  icon: signal-desktop
  ifexist: signal-desktop
  window_class: signal

firefox:
  args: ["-X", "firefox"]
  binary: jumpapp
  description: "Firefox"
  icon: firefox
  window_class: firefox
  desktop: firefox.desktop

ipython:
  binary: kitty-ctrl
  args: ["jump", "-t IPython", "ipython3"]
  description: "Ipython"
  icon: ipython
  window_class: kitty

# env sets variables for this launcher only; values expand ~/ and ${VAR}.
ipython-startup:
  binary: kitty
  args: ["ipython3"]
  description: "Ipython with startup file"
  icon: ipython
  window_class: kitty
  env:
    PYTHONSTARTUP: "~/.config/python/startup.py"

ssh-kodi:
  binary: kitty-ctrl
  args: ["jump", "-t", "Kodi", "ssh", "kodi"]
  description: "Kodi"
  icon: kodi
  window_class: kitty

ssh-pi:
  binary: kitty-ctrl
  args: ["jump", "-t", "PI", "ssh", "pi"]
  description: "PI"
  icon: raspberry
  window_class: kitty

ssh-bootstrap:
  binary: kitty-ctrl
  args: ["jump", "-t", "Bootstrap", "ssh", "bootstrap"]
  description: "Bootstrap SSH"
  icon: bootstrap
  window_class: kitty

golang:
  binary: jumpapp
  args: ["-c", "jetbrains-goland", "goland"]
  description: "Goland"
  icon: /opt/goland/bin/goland.svg
  window_class: jetbrains-goland
  show_preview: true # show the command and usage stats in the preview pane for this entry

add-org-note:
  binary: add-org-task
  description: "Add org note"
  icon: writenote

# An alias types its text into the search box when picked. With a keyword,
# typing "ghraffi release" searches like "gh chmouel/raffi release"
# ("gh" is configured under addons.web_searches in examples/raffi.yaml)
# while the box keeps showing what you typed.
ghraffi:
  description: "Raffi on GitHub"
  icon: github
  alias: "gh chmouel/raffi"
  keyword: ghraffi

center-window:
  binary: wmctrl-resize-and-center
  description: "Center window"
  icon: wmsnap
  ifenveq: [XDG_SESSION_TYPE, x11]

jump-to-org-file:
  args: [jumpto]
  binary: add-org-task
  description: "Jump to org file"
  icon: notes-app
  raise: false

keyboard-setting:
  args: [keyboard]
  binary: gnome-control-center
  description: "Keyboard setting"
  icon: preferences-desktop-keyboard-shortcuts
  ifenveq: [DESKTOP_SESSION, GNOME]
  window_class: gnome-control-center

snap-window-around:
  args: [rotate]
  binary: wmctrl-resize-and-center
  description: "Snap window around"
  icon: wmaround
  ifenveq: [XDG_SESSION_TYPE, x11]
  raise: false

ssh:
  args: ["-show", "ssh", "-theme", "mounch"]
  binary: rofi
  description: "SSH"
  icon: ssh
  ifenveq: [XDG_SESSION_TYPE, x11]
  raise: false

bpytop:
  binary: kitty-ctrl
  args: ["jump", "bpytop"]
  description: "BpyTOP"
  icon: bashtop
  ifexist: bpytop
  window_class: kitty

show-tv:
  binary: playr
  icon: tv
  description: "Play TV"
  ifexist: playr

show-tv-groups:
  binary: playr
  args: ["-G"]
  icon: tv
  description: "Play TV choose groups"
  ifexist: playr
  raise: false

gnome-activity:
  binary: gnome-show-activity
  description: "Gnome Activity"
  icon: gnome-run
  ifenveq: [DESKTOP_SESSION, GNOME]

spotify:
  args: ["-X", "-c", "Spotify", "spotify"]
  binary: jumpapp
  description: "Spotify"
  icon: spotify
  ifexist: spotify
  window_class: Spotify

vscode:
  args: ["-X", "-c", "Visual Studio Code", "code"]
  binary: jumpapp
  description: "VSCode"
  icon: visual-studio-code
  ifexist: code
  window_class: code
  desktop: code.desktop

start-kind:
  binary: kitty-ctrl
  args: ["jump", "-t", "Kind", "startkind"]
  description: "Start Kind"
  icon: kind-started
  ifexist: kind
  window_class: kitty

stop-kind:
  binary: kitty-ctrl
  args: ["jump", "-t", "Kind", "stopkind"]
  description: "Stop Kind"
  icon: kind-stopped
  ifexist: kind
  window_class: kitty

windows:
  binary: systemctl
  args: ["reboot", "--boot-loader-entry=auto-windows"]
  description: Reboot to windows
  icon: windows
  ifenvset: SWAYSOCK
  raise: false

screenshot-clipboard:
  description: Screenshot to clipboard
  args: [selection-clipboard]
  binary: sway-screenshot
  icon: screenshoticon
  ifenvset: SWAYSOCK
  raise: false

screenshot-file:
  description: Screenshot to file
  args: [selection-file]
  binary: sway-screenshot
  icon: screenshoticon
  ifenvset: SWAYSOCK
  raise: false

screenshot-window-clipboard:
  description: Screenshot window to clipboard
  args: [selection-window-clipboard]
  binary: sway-screenshot
  icon: screenshoticon
  ifenvset: SWAYSOCK
  raise: false

screenshot-window-file:
  description: Screenshot window to file
  args: [selection-window-file]
  binary: sway-screenshot
  icon: screenshoticon
  ifenvset: SWAYSOCK
  raise: false

screenshot-movie-selection:
  description: Screencast movie selection
  args: [movie-selection]
  binary: sway-screenshot
  icon: movierecord
  ifenvset: SWAYSOCK
  raise: false

screenshot-movie-screen:
  description: Screencast movie screen
  args: [movie-screen]
  binary: sway-screenshot
  icon: movierecord
  ifenvset: SWAYSOCK
  raise: false

screenshot-stop-recording:
  description: Screencast stop recording
  args: [stop-recording]
  binary: sway-screenshot
  icon: stoprecording
  ifenvset: SWAYSOCK
  raise: false

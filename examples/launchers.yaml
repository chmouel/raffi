# yaml-language-server: $schema=launchers-schema.json
# Your own entries, keyed by name: ~/.config/raffi/launchers.yaml.
# Installed applications need no entry, see `addons.apps` in raffi.yaml.
# Fields: https://chmouel.github.io/raffi/configuration/entries/
# Conditions: https://chmouel.github.io/raffi/configuration/conditions/
# Validate with: raffi --check-config

# Enter focuses Thunderbird when it is open, Ctrl+Enter starts another one.
# The window class defaults to the binary name.
thunderbird:
  binary: thunderbird
  description: "Thunderbird"
  icon: thunderbird
  ifexist: thunderbird
  raise: true

# With arguments, name the window class. `desktop` stops the installed
# Firefox from being listed twice and keeps its actions.
firefox-work:
  binary: firefox
  args: ["-P", "work", "--name", "firefox-work"]
  description: "Firefox (Work profile)"
  icon: firefox
  raise: true
  window_class: firefox-work
  desktop: firefox.desktop

# A terminal app in its own kitty window, focused again when already open.
btop:
  binary: kitty
  args: ["--class", "btop", "btop"]
  description: "btop"
  icon: utilities-system-monitor
  ifexist: btop
  raise: true
  window_class: btop

# `raise: false` always starts a new one, even with general.raise_running.
ssh-server:
  binary: kitty
  args: ["ssh", "user@server.example.com"]
  description: "SSH to server"
  icon: utilities-terminal
  raise: false

# A script runs with general.default_script_shell. This one grabs a region
# and opens it in satty to annotate, then copy or save it.
screenshot:
  script: |
    grim -g "$(slurp -d)" - |
      satty --filename - --copy-command wl-copy --early-exit
  description: "Screenshot a region and annotate it"
  icon: applets-screenshooter
  ifcompositor: [hyprland, niri, sway]
  ifexist: satty
  raise: false

# `env` applies to this entry only; values expand ~/ and ${VAR}.
ipython:
  binary: kitty
  args: ["ipython"]
  description: "IPython with a startup file"
  icon: ipython
  ifexist: ipython
  raise: false
  env:
    PYTHONSTARTUP: "~/.config/python/startup.py"

# An alias types its text for you. With a keyword, "proj release" searches
# "gh owner/project release" through the `gh` web search in raffi.yaml.
project-on-github:
  description: "Project on GitHub"
  icon: github
  alias: "gh owner/project"
  keyword: proj

# Shown only in a GNOME session.
keyboard-settings:
  binary: gnome-control-center
  args: ["keyboard"]
  description: "Keyboard settings"
  icon: preferences-desktop-keyboard
  ifenveq: [XDG_CURRENT_DESKTOP, GNOME]
  raise: false

# Raffi stays open after it runs, to toggle again or pick something else.
do-not-disturb:
  binary: swaync-client
  args: ["--toggle-dnd", "--skip-wait"]
  description: "Toggle Do Not Disturb"
  icon: notifications-disabled
  ifexist: swaync-client
  close_on_action: false
  raise: false

# Hidden on machines where you export WORK_LAPTOP (set it in your session
# environment there). `show_preview` previews it even with the pane off.
reboot-to-windows:
  binary: systemctl
  args: ["reboot", "--boot-loader-entry=auto-windows"]
  description: "Reboot to Windows"
  icon: system-reboot
  ifenvnotset: WORK_LAPTOP
  show_preview: true
  raise: false

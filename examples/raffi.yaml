# yaml-language-server: $schema=raffi-schema.json
# Raffi starter config. Every setting is optional.
# All settings and addons, commented: examples/raffi.full.yaml, or `raffi --print-config`.
# Your own entries go in launchers.yaml next to this file (see examples/launchers.yaml).
version: 1

# General settings: https://chmouel.github.io/raffi/configuration/general-settings/
general:
  theme: dark
  # font_size: 20            # Paddings and the other text sizes scale with it
  # font_family: "Inter"     # Default: the system sans-serif
  # window_width: 800
  # window_height: 600
  # padding: 20
  # opacity: 0.95            # 0.0 is see-through, 1.0 is the theme as designed
  # show_preview: true       # Right-hand preview pane; Ctrl+P toggles it
  # preview:
  #   width_percent: 50
  #   font_size: 16
  # close_on_action: true    # Close Raffi after running an entry
  # launch: auto             # auto asks Hyprland, niri or sway to start apps; direct runs them
  # raise_running: false     # Enter focuses an open window instead of starting the app again
  # max_history: 10          # Search queries kept, Alt-P and Alt-N walk them
  # sort_mode: hybrid        # Order snippets and passwords by frequency, recency or hybrid
  # main_view: [launchers, windows, clipboard]   # Sources mixed into the main list
  # theme_colors:            # Override single colours, as #RRGGBB or #RRGGBBAA
  #   accent: "#cba6f7"

addons:
  # Addon reference: https://chmouel.github.io/raffi/reference/addon-configuration/

  # Clipboard history, type "clip " to browse it.
  # https://chmouel.github.io/raffi/features/clipboard-history/
  clipboard:
    enabled: true

  # Password store, type "pass ". Enter copies, Ctrl+Enter types the password.
  # https://chmouel.github.io/raffi/features/password-store/
  pass:
    enabled: true
    # store_dir: ~/.password-store
    # clipboard_timeout: 45

  # Apps are listed on their own when no valid launchers are configured; set
  # `apps.enabled: true` to list them next to your launchers.
  # https://chmouel.github.io/raffi/features/installed-apps/
  # apps:
  #   enabled: true
  #   actions: true          # Also list actions such as "Firefox: New Private Window"

  # A web search: the typed query replaces {query}.
  # https://chmouel.github.io/raffi/features/web-search/
  web_searches:
    - name: "GitHub"
      keyword: "gh"
      url: "https://github.com/search?q={query}&type=repositories"
      icon: "github"

  # A script filter: type its keyword, then a query; it prints items as JSON.
  # https://chmouel.github.io/raffi/features/script-filters/
  # script_filters:
  #   - name: "Calculator"
  #     keyword: "calc"
  #     command: "~/.config/raffi/scripts/calc.py"
  #     icon: "accessories-calculator"
  #     action: "copy"

  # Text snippets: type their keyword to pick one, Enter types or copies it.
  # https://chmouel.github.io/raffi/features/text-snippets/
  # text_snippets:
  #   - name: "Emails"
  #     keyword: "em"
  #     icon: "mail"
  #     action: "copy"
  #     snippets:
  #       - name: "Personal"
  #         value: "user@example.com"
  #       - name: "Work"
  #         value: "user@company.com"

# Find every CLI flag and option here:
# https://chmouel.github.io/raffi/reference/cli-options/
# Validate this file with: raffi --check-config

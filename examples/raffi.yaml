# yaml-language-server: $schema=raffi-schema.json
# Validate this file with: raffi --check-config
version: 1

# Raffi can auto-detect installed desktop applications when your config does not
# contain any valid launchers yet, but keeping explicit entries in launchers.yaml gives you
# stable names, icons, and arguments across systems.

# General settings (all fields optional, CLI flags override these)
# general:
#   ui_type: native          # Native is the default; fuzzel selects the
#                            # deprecated legacy external Fuzzel UI
#   default_script_shell: bash  # Shell for script entries
#   no_icons: false          # Hide icons
#   max_history: 10          # Max search query history entries (0 to disable, navigate with Alt-P/N)
#   theme: dark              # Built-in theme: dark (default), light, catppuccin, catppuccin-latte,
#                            # tokyo-night, nord, gruvbox, dracula, rose-pine, or kanagawa.
#                            # Also sets the ANSI palette used in previews
#   font_size: 20            # Base font size in px (default: 20). Other sizes and paddings
#                            # scale proportionally (input=24, items=20, subtitles=14, hints=12)
#   font_family: "Inter"     # Font family name (default: system sans-serif)
#   window_width: 800        # Initial window width in px (default: 800)
#   window_height: 600       # Initial window height in px (default: 600)
#   padding: 20              # Outer window padding in pixels (default: 20, scales with font_size)
#   show_preview: true       # Right-hand preview pane. Addons (snippets, files, script filters...)
#                            # preview automatically; plain launchers only when this is true or the
#                            # launcher sets show_preview: true. Toggle at runtime with Ctrl+P.
#   show_tips: true          # Keyword tip in the empty search box, e.g. "clip for Clipboard history"
#   preview:                 # Appearance of the preview pane
#     font_size: 16          # Base preview text size in px (default: 16)
#     font_family: "Inter"   # Font for the pane (default: the UI font)
#     mono_font_family: "JetBrains Mono"  # Font for code/text blocks (default: system monospace)
#     width_percent: 50      # Pane width as a share of the window, 10-80 (default: 50)
#     colors:                # Hex overrides; defaults come from the theme
#       bg: "#31324480"
#       bg_block: "#1e1e2e"
#       text_main: "#cdd6f4"
#       text_muted: "#6c7086"
#       accent: "#cba6f7"
#       border: "#585b70"
#   sort_mode: hybrid        # Order launchers, snippets and pass/bw entries by use: frequency, recency, or hybrid (default: hybrid)
#   clipboard_history: auto  # Manager for {clipboard:N} in snippets: auto, cliphist, copyq, clipman or none
#   terminal_classes:        # Extra window classes that hypr_paste treats as terminals (Ctrl+Shift+V)
#     - my-terminal          # Added to the built-in list; find a class with `hyprctl activewindow`
#   fallbacks:               # Addons shown at the bottom of results when typing a query
#     - addons.web_searches."Google"           # Opens Google search with the current query
#     - addons.web_searches."DuckDuckGo"       # Opens DuckDuckGo search with the current query
#     - addons.script_filters."Search Google"  # Switches to the script filter mode
#     - addons.terminal                        # Runs the query in a terminal
#   main_view:               # Mix addon results into the main list (native UI only); Ctrl+Tab shows one source at a time.
#                            # An empty query shows one row of chips with each detected entry's keyword
#                            # (sys, tabs, clip...) above the apps; Left/Right pick one, Enter arms it.
#                            # With no config file at all, raffi uses launchers, windows, browser_tabs, system,
#                            # media, audio, bluetooth, pass, clipboard, bitwarden, terminal, emoji.
#     - launchers            # Keep launchers; once main_view is set they only show if listed
#     - browser_tabs         # Typing "gmail" lists matching tabs, up to 5 per addon;
#                            # with no query, your 5 latest addon picks are listed;
#                            # groups with a title starting with the query come first
#     - windows              # Also: system, media, audio, bluetooth, pass
#     - clipboard            # Keyword chip only, no rows: also bitwarden, terminal, emoji
#     - text_snippets."Emails"       # A snippet source, by name
#     - script_filters."Bookmarks"   # A script filter, run when typing pauses
#   theme_colors:            # Override individual colours (hex: #RGB, #RRGGBB, or #RRGGBBAA)
#     bg_base: "#1e1e2e"
#     bg_input: "#313244"
#     accent: "#cba6f7"
#     accent_hover: "#89b4fa"
#     text_main: "#cdd6f4"
#     text_muted: "#6c7086"
#     selection_bg: "#45475a"
#     border: "#585b70"
#   renderer: cpu            # Native UI renderer: cpu (default, opens fastest) or gpu; ICED_BACKEND overrides it

# Launchers live in launchers.yaml next to this file, see examples/launchers.yaml.
# A `launchers:` section here still works and takes precedence over launchers.yaml.

addons:
  # Keywords below (script_filters, web_searches, text_snippets) are typed with
  # a trailing space: "tz " enters the timezone filter, while "tz" on its own
  # keeps searching your launchers. While you type a keyword, raffi lists the
  # matching keywords at the top of the results; Enter or Tab on one of those
  # rows completes the input for you. Suggestions start after
  # keyword_min_chars characters (default 3), or as soon as a keyword is typed
  # in full. Whole words such as "volume", "password" or "lock" suggest the
  # addon that handles them, and a query matching nothing lists the keywords
  # whose help mentions it.
  # keyword_min_chars: 3
  #
  # Press Ctrl+/ (or type ? alone) in the native UI to see addon keywords/actions and keyboard
  # shortcuts in separate sections. Typing filters both; opening help clears
  # the current query temporarily, and Escape restores it. Enter or Tab on a
  # keyword row applies its completion.
  script_filters:
    # grab batz from https://github.com/chmouel/batzconverter
    - name: "Timezones"
      keyword: "tz"
      command: "batz"
      args: ["-j"]
      icon: "clock"
      min_query_length: 2 # only execute after 2 chars typed after keyword
      env:
        TZ_FORMAT: "short" # environment variables passed to the script process
      # With the preview pane open (Ctrl+P), raffi runs the command again with
      # RAFFI_PREVIEW=1 for the selected item and shows the preview object it
      # prints. Scripts that only print items are detected and skipped.
      # Commands with side effects should check RAFFI_PREVIEW or turn this off.
      # dynamic_preview: false # turn it off for this filter (default: true)
    # action/secondary_action accept two special keywords:
    #   "copy"   — copy to clipboard via wl-copy (default for Enter)
    #   "insert" — type into focused app via wtype/ydotool
    # Any other string is run as a shell command via sh -c, with {value} replaced.
    # Example with a custom action and secondary action (Ctrl+Enter):
    # - name: "Bookmarks"
    #   keyword: "bm"
    #   command: "my-bookmark-script"
    #   args: ["-j"]
    #   action: "copy"
    #   secondary_action: "xdg-open {value}"

    # Web search with DuckDuckGo autocomplete suggestions. The preview pane
    # shows the DuckDuckGo Instant Answer (summary and image) for a suggestion.
    # Copy scripts/search/search.py to ~/.config/raffi/scripts/search/search.py and make it executable.
    # See scripts/search/README.md for full setup instructions.
    # - name: "Search DuckDuckGo"
    #   keyword: "ddg"
    #   command: "python3"
    #   args: ["~/.config/raffi/scripts/search/search.py", "duckduckgo"]
    #   icon: "web-browser"
    #   action: "xdg-open {value}"
    #   secondary_action: "copy"
    # - name: "Search Google"
    #   keyword: "sg"
    #   command: "python3"
    #   args: ["~/.config/raffi/scripts/search/search.py", "google"]
    #   icon: "google"
    #   action: "xdg-open {value}"
    #   secondary_action: "copy"
    # - name: "Search Bing"
    #   keyword: "sb"
    #   command: "python3"
    #   args: ["~/.config/raffi/scripts/search/search.py", "bing"]
    #   icon: "web-browser"
    #   action: "xdg-open {value}"
    #   secondary_action: "copy"
    # - name: "Search Brave"
    #   keyword: "sbr"
    #   command: "python3"
    #   args: ["~/.config/raffi/scripts/search/search.py", "brave"]
    #   icon: "web-browser"
    #   action: "xdg-open {value}"
    #   secondary_action: "copy"

    # Herdr session browser. Install herdr_filter.py and its sibling icons/
    # directory from scripts/herdr/ (including the icon license notices).
    # Single-pane tabs appear once; multi-pane tabs show their pane children.
    # The query filters the tree and keeps ancestors of matches. Items
    # export HERDR_KIND and HERDR_FOCUS, so the action focuses whatever you
    # picked. Add args: ["--agents"] for a flat list of agents only.
    # The preview pane shows live terminal output, pane lists, or tab lists.
    # HERDR_VIEW: status groups agents by Working/Waiting/Idle/Done/Unknown,
    # with counts and non-actionable headings; shells stay in the workspace view.
    # - name: "Herdr"
    #   keyword: "herdr"
    #   command: "~/.config/raffi/scripts/herdr/herdr_filter.py"
    #   icon: "utilities-terminal"
    #   env:
    #     HERDR_ICON_SET: color  # Default; mono-dark or mono-light for monochrome icons
    #     HERDR_VIEW: workspace  # Default; status for an agent status tree (or args: ["--status"])
    #   action: >-
    #     case "$HERDR_KIND" in
    #       workspace) herdr workspace focus "$HERDR_FOCUS" ;;
    #       tab) herdr tab focus "$HERDR_FOCUS" ;;
    #       agent) herdr agent focus "$HERDR_FOCUS" ;;
    #       *) herdr tab focus "$HERDR_FOCUS" ;;
    #     esac
    # For compositor-specific window focus commands, see scripts/herdr/README.md.

    # GitHub pull requests with CI status. Install scripts/github/pr.py first.
    # "pr" lists your open pull requests, "pr owner/repo" those of a repository,
    # "pr review", "pr assigned" and "pr involved" the ones that concern you.
    # Cross-repository results group under owner headings when multiple owners
    # are present; single-owner and fixed-repository results stay flat.
    # The preview pane shows reviewers, merge state, checks, closed issues,
    # description, latest comments and changed files. Each row exports
    # PR_URL, PR_REPO, PR_NUMBER and PR_BRANCH to the actions.
    # See scripts/github/README.md for aliases and settings.
    # - name: "Pull Requests"
    #   keyword: "pr"
    #   command: "~/.config/raffi/scripts/github/pr.py"
    #   icon: "github"
    #   action: "xdg-open {value}"
    #   secondary_action: "copy"
    # One keyword per repository, the typed text only filters:
    # - name: "Raffi Pull Requests"
    #   keyword: "rafpr"
    #   command: "~/.config/raffi/scripts/github/pr.py"
    #   args: ["--repo", "chmouel/raffi"]
    #   icon: "github"
    #   action: "xdg-open {value}"
    #   secondary_action: "copy"

  # text_snippets:
  #   - name: "Emails"
  #     keyword: "em"
  #     icon: "mail"
  #     # action/secondary_action accept three special keywords:
  #     #   "copy"   — copy to clipboard via wl-copy (default for Enter)
  #     #   "insert" — type into focused app via wtype/ydotool (default for Ctrl+Enter)
  #     #   "hypr_paste" — paste into the original window on Hyprland (default for
  #     #                  Enter inside Hyprland; set action: "copy" to keep copying)
  #     #                  (Ctrl+V, or Ctrl+Shift+V in terminals; see general.terminal_classes)
  #     # Any other string is run as a shell command via sh -c, with {value} replaced.
  #     # The value is also exported as $RAFFI_VALUE; prefer "$RAFFI_VALUE" over
  #     # {value} in custom commands when the snippet may contain shell syntax.
  #     action: "insert"                       # primary action on Enter: type into focused app
  #     secondary_action: "copy"               # secondary action on Ctrl+Enter: copy to clipboard
  #     # Use action: "hypr_paste" on Hyprland (Lua API) with hyprctl and wl-clipboard.
  #     # hypr_paste marks snippets sensitive so CopyQ's default settings keep them out of history.
  #     # {cursor} does not reposition the caret with hypr_paste.
  #     restore_clipboard: false               # hypr_paste: true restores old plain text after 1s
  #     # Restoration needs wl-paste; skips newer copies and unavailable/non-text snapshots.
  #     snippets:
  #       - name: "Personal Email"
  #         icon: "📨"                        # optional emoji, icon name, or image path
  #         keyword: "!me"                     # optional abbreviation, ranked first when typed
  #         value: "user@example.com"
  #       - name: "Work Email"
  #         value: "user@company.com"
  #       # Dynamic placeholders (on by default):
  #       #   {clipboard} {clipboard:1} {date} {time} {datetime} {date:%A %d %B} {date +1d}
  #       #   {random:uuid} {random:1-100} {env:VAR} {snippet:NAME} {shell:CMD}
  #       #   {cursor}, and transforms like {clipboard|trim|uppercase}.
  #       #   Write \{date} for a literal {date}, in single quotes or a block
  #       #   scalar since "\{" is an invalid YAML escape: value: '\{date} is {date}'
  #       - name: "Quote clipboard"
  #         value: "> {clipboard|trim}"
  #       - name: "Previous copy"                # needs cliphist, CopyQ or clipman running
  #         value: "{clipboard:1|trim}"
  #       - name: "Follow-up"
  #         value: "Follow up on {date +1w:%A %d %B}: {cursor}"
  #   - name: "Templates"
  #     keyword: "tpl"
  #     icon: "document"
  #     file: "~/.config/raffi/snippets.yaml"
  #     placeholders: false                  # use values exactly as written
  #   - name: "Dynamic"
  #     keyword: "dyn"
  #     icon: "terminal"
  #     command: "my-snippet-gen"
  #     args: ["-j"]
  #   - name: "Snippets"
  #     # Download the work templates linked in the text snippets documentation.
  #     keyword: "sn"
  #     icon: "snippets"
  #     directory: "~/.local/share/snippets"

  web_searches:
    - name: "Google"
      keyword: "g"
      url: "https://google.com/search?q={query}"
      icon: "google"
    - name: "DuckDuckGo"
      keyword: "ddg"
      url: "https://duckduckgo.com/?q={query}"
    - name: "GitHub"
      keyword: "gh"
      url: "https://github.com/search?q={query}&type=repositories"
      icon: "github"

  # File browser: type "/" or "~/" to browse. fido_style (on by default) edits
  # paths the way Emacs fido-mode does: Backspace on a trailing "/" goes up to
  # the parent directory, and typing "~/" or "/" right after a "/" starts over
  # from home or the root. Set it to false to edit the path as plain text.
  # action (Enter on a file) and secondary_action (Ctrl+Enter or Ctrl+click on
  # a file or directory) accept "open" (xdg-open), "copy", "insert", or a shell
  # command where {value} is the full path.
  # Ctrl+O opens the selected file or directory with xdg-open, whatever action
  # says. Ctrl+B opens the browsed directory in a file manager. Leave file_manager
  # unset to autodetect (desktop's own: dolphin, nautilus, thunar, nemo, caja,
  # pcmanfm...; else the first installed; else xdg-open). Without {value} the
  # directory is appended as the last argument. Nautilus, Dolphin, Nemo and
  # Caja also get the selected entry highlighted.
  # Ctrl+Y copies the selected path regardless of the configured actions.
  # Ctrl+Alt+Y copies a supported image file to the system clipboard (requires
  # wl-copy or xclip).
  # sort sets the initial order: name, modified (alias: date) or created, the
  # last two newest first. Ctrl+S cycles through them while browsing.
  # sort_reverse: true flips the order (Z to A, or oldest first).
  # show sets the initial listing: all, files or directories (alias: dirs).
  # Ctrl+. cycles through them while browsing.
  # preview_command previews the selected entry (PDF pages, video frames,
  # ebook covers, archives, highlighted source...). Unset uses the previewer
  # bundled with raffi when python3 is installed; "none" turns it off. A
  # custom command gets the path as last argument and prints ANSI text or a
  # preview JSON object; no output or a non-zero exit keeps the built-in
  # preview. To customise the bundled one, copy
  # scripts/file-preview/file-preview.py from the raffi repository.
  # file_browser:
  #   enabled: true
  #   show_hidden: false
  #   sort: name
  #   sort_reverse: false
  #   show: all
  #   fido_style: true
  #   action: open
  #   secondary_action: copy
  #   file_manager: thunar
  #   preview_command: "~/.config/raffi/scripts/file-preview.py"

  # Clipboard history browser (native UI only). On by itself when CopyQ is
  # running at startup; set enabled to force it on or off. Reads the
  # history stored by CopyQ, which must be running. Type "clip " to browse,
  # or bind a key to `raffi -u native -i "clip "`. Enter copies the item with
  # all its formats (text, HTML, images, file lists); Ctrl+Enter pastes it
  # into the previous window on Hyprland. Ctrl+R refreshes the list and
  # Ctrl+I shows only images; "clipimg " opens it with only images.
  # Ctrl+D deletes the selected entry from CopyQ.
  # Rows show the copy time when CopyQ stores it (its "Show Copy Time"
  # command). action and secondary_action accept copy or hypr_paste.
  # clipboard:
  #   enabled: true
  #   trigger: clip
  #   image_trigger: clipimg
  #   min_chars: 3            # hide text entries shorter than this
  #   backend: copyq
  #   action: copy
  #   secondary_action: hypr_paste

  # System commands (native UI only). Type "sys " to list lock, suspend,
  # hibernate, log out, reboot and shut down. Everything except lock asks
  # for a second Enter. Commands are argument lists run without a shell;
  # an empty list hides the entry, like `hide`. The "sys " keyword takes
  # over launcher searches starting with "sys "; change `trigger` or set
  # `enabled: false` to keep them.
  # system:
  #   enabled: true
  #   trigger: sys
  #   commands:
  #     lock: [hyprlock]
  #   hide: [hibernate]

  # Window switcher (native UI only, Hyprland, niri or sway). Type "win " to
  # list open windows, most recently used first. Enter focuses the window,
  # Ctrl+Enter moves it to the current workspace and focuses it.
  # windows:
  #   enabled: true
  #   trigger: win

  # Browser tabs (native UI only). Type "tabs " to list the tabs of your
  # browsers, playing ones first. Enter switches to the tab, Ctrl+Enter
  # closes it. Needs the Vicinae browser extension and a one-time
  # `raffi --install-browser-host`. Site icons come from the browser
  # profiles, then from favicon_service (twenty, google or none to stay
  # offline), which receives the domains of the open tabs. The preview pane
  # shows the selected page's description and image, fetched from the site
  # unless favicon_service is none.
  # browser_tabs:
  #   enabled: true
  #   trigger: tabs
  #   favicon_service: twenty

  # Media controls (native UI only, needs playerctl). Type "media " to play,
  # pause, skip or stop any running media player. Raffi stays open and
  # refreshes after each action unless close_on_action is true.
  # media:
  #   enabled: true
  #   trigger: media
  #   close_on_action: false

  # Audio switcher (native UI only, needs pactl). Type "audio " to list
  # volume controls, outputs and inputs. Enter makes a device the default,
  # Ctrl+Enter mutes or unmutes it. "audio 40" or "vol 40" in main_view sets
  # the output volume. Raffi stays open and refreshes unless close_on_action
  # is true.
  # audio:
  #   enabled: true
  #   trigger: audio
  #   close_on_action: false
  #   volume_step: 5      # Percent changed by Volume up and down
  #   max_volume: 100     # Highest volume Volume up and "vol N" will set

  # Installed applications. List the .desktop apps of your system next to
  # your launchers, with their actions such as "Firefox: New Private Window".
  # Apps with the same name or command as a launcher are skipped. Without
  # any launcher configured, apps are listed even when this is off.
  # apps:
  #   enabled: false
  #   actions: true       # Also list desktop actions

  # Run in terminal (native UI only). Type "> htop" to run htop in a
  # terminal. The terminal is found automatically (xdg-terminal-exec,
  # $TERMINAL, then kitty, foot, alacritty, wezterm, ghostty, konsole,
  # gnome-terminal, xfce4-terminal, xterm) unless command is set. The command
  # runs with general.default_script_shell; hold keeps the window open
  # until Enter once it exits. With kitty or WezTerm already running, the
  # command opens in a new tab of it (open_in: window turns that off). kitty
  # needs allow_remote_control and listen_on in kitty.conf; kitty_socket
  # overrides the listen_on read from there (Unix sockets only).
  # terminal:
  #   enabled: true
  #   trigger: ">"
  #   command: [alacritty, -e]
  #   hold: true
  #   open_in: tab
  #   kitty_socket: unix:${XDG_RUNTIME_DIR}/kitty

  # Kill process (native UI only, needs kill). Type "kill " to list your own
  # processes, biggest memory first. Enter twice sends SIGTERM, Ctrl+Enter
  # twice sends SIGKILL. Raffi stays open and refreshes the list.
  # kill:
  #   enabled: true
  #   trigger: kill

  # Bluetooth (native UI only, needs bluetoothctl). Type "bt " to list your
  # paired devices under a row that turns Bluetooth on or off. Enter
  # connects a device, or disconnects it when pressed twice. Turning
  # Bluetooth off also needs a second Enter. Raffi stays open and refreshes
  # the list.
  # bluetooth:
  #   enabled: true
  #   trigger: bt
  #   close_on_action: false

  # Password store (native UI only, needs pass and gpg). Type "pass " to
  # list your entries. Enter copies the password, Ctrl+Enter types it,
  # Ctrl+U copies the username, Ctrl+O the OTP code (pass-otp). When
  # gpg-agent has no cached passphrase Raffi asks for it in a masked prompt;
  # "pinentry: agent" lets gpg-agent's own pinentry ask instead (smartcards,
  # YubiKeys). Pasting a URL lists the entries named after its site first.
  # pass:
  #   enabled: true
  #   trigger: pass
  #   store_dir: ~/.password-store   # default: $PASSWORD_STORE_DIR or this
  #   pinentry: raffi                # raffi | agent
  #   username_fields: [login, user, username]
  #   clipboard_timeout: 45          # seconds, 0 = never clear
  #   type_delay_ms: 200

  # Bitwarden (native UI only, through rbw, set up with "rbw login").
  # Type "bw " to list your logins, same keys as pass. A locked vault is
  # unlocked with rbw's pinentry; the lock timeout is rbw's lock_timeout.
  # Pasting a URL lists that site's logins first, and after a pause rbw also
  # searches notes and custom fields ("notes" pill).
  # bitwarden:
  #   enabled: true
  #   trigger: bw
  #   clipboard_timeout: 45
  #   type_delay_ms: 200

  # Slack (native UI only, off by default). Type "slack " to open channels,
  # DMs and people, "slack search <words>", "slack people <name>",
  # "slack unread", or
  # "slack status Lunch :pizza: 1h". The token is a user token (xoxp-) from
  # your own Slack app, or a browser session token (xoxc-) with its "d"
  # cookie. Ctrl+P previews the latest messages.
  # slack:
  #   enabled: true
  #   trigger: slack
  #   token_command: "pass show slack/token"
  #   cookie_command: "pass show slack/cookie"   # xoxc- tokens only
  #   open_in: desktop                            # desktop | browser
  #   unread_conversations: ["#ops", "@alice"]    # for xoxp- tokens

  # Unit conversion (native UI only). Type "10 km to mi", "70f to c" or
  # "5 GB in MB" without any keyword. Enter copies the number, Ctrl+Enter
  # copies it with the unit.
  # units:
  #   enabled: true

  # Color converter (native UI only). Type "#ff8800", "rgb(255 136 0)" or
  # "hsl(32 100% 50%)" to see the color as hex, rgb, hsl and the nearest
  # CSS color name. Enter copies the selected format.
  # color:
  #   enabled: true

  # World clock (native UI only, needs tzdata). Type "time tokyo" or
  # "time in new york" for the current time there, or "15:00 paris to nyc"
  # to convert a time. Enter copies the time, Ctrl+Enter a full timestamp.
  # world_clock:
  #   enabled: true

  # Developer tools (native UI only). Type "dev " followed by text to see it
  # base64 and URL encoded or decoded, hashed (sha256sum, sha1sum, md5sum),
  # converted between epoch and date, JSON reformatted or case changed.
  # Typing "uuid", "pw" or "pw 32" shows a random UUID or password. Enter
  # copies. None of these are saved in the search history.
  # devtools:
  #   enabled: true
  #   trigger: dev
  #   password_length: 20

name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Rust CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    steps:
      - name: Find matching Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}" \
            -f base=main |
            jq --arg head_sha "$HEAD_SHA" -r '[.[] | select(.user.login == "dependabot[bot]" and .head.sha == $head_sha) | .number][0] // empty')"
          if [ -z "$pr_number" ]; then
            echo "No open Dependabot Actions PR for the successful commit."
            exit 0
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Enable squash auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

[package]
authors = ["Chmouel Boudjnah <chmouel@chmouel.com>"]
name = "raffi"
description = "A simple fuzzel launcher based on YAML file"
version = "0.24.0"
edition = "2021"
readme = "README.md"
license = "Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["task", "command", "launch"]
homepage = "https://github.com/chmouel/raffi"
documentation = "https://github.com/chmouel/raffi"
repository = "https://github.com/chmouel/raffi"

[features]
default = ["wayland", "config-validation"]
wayland = [
  "iced",
  "ureq",
  "regex",
  "evalexpr",
  "chrono",
  "shlex",
  "wayland-client",
  "calloop",
  "calloop-wayland-source",
  "jiff",
  "base64",
]
config-validation = ["jsonschema"]

[dependencies]
anyhow = "1.0.102"
gumdrop = { version = "0.8.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
walkdir = "2.5.0"
fuzzy-matcher = "0.3.7"
iced = { version = "0.14", features = [
  "tiny-skia",
  "image",
  "svg",
], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
regex = { version = "1.12", optional = true }
shlex = { version = "2.0", optional = true }
schemars = { version = "1.2", features = ["derive"] }
jsonschema = { version = "0.58.3", default-features = false, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
wayland-client = { version = "0.31", optional = true }
calloop = { version = "0.14", optional = true }
calloop-wayland-source = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"], optional = true }
evalexpr = { version = "13.1.0", optional = true }
